[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dadvar"
version = "0.1.0"
description = "A benchmark for typed-decision models: public datasets in the TypeSafe System One schema, run and scored against local checkpoints and hosted models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ashkan Aazami" }
]
keywords = ["benchmark", "evaluation", "decision-model", "system-one", "typed-decisions", "calibration", "typesafe", "laya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
bench = [
    "datasets>=3.0",
    "typesafe-sdk>=0.7",
]

[tool.setuptools]
# Only the runtime is a distributable package; `data` and `benchmarks` are run from a clone
# (`python -m benchmarks.run`) and their names are too generic to install.
packages = ["dadvar"]

[project.urls]
Repository = "https://github.com/ashaazami/dadvar"
Issues = "https://github.com/ashaazami/dadvar/issues"
