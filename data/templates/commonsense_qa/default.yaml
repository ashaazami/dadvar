# CommonsenseQA: held out, evaluation only.

source: commonsense_qa
dataset: tau/commonsense_qa
configs: [default]               # the dataset configs to load
splits: {eval: validation, train: null}  # which Hugging Face split the eval and train rows come from (null: none)
license: mit
use: {benchmark: true, train: false}  # what this source may be used for; the builder enforces it
commercial: true                 # may train a model sold commercially: mit
default: false                   # left out of an `all` run unless named
record: commonsense_qa
state:
  question: question

questions:

  answer:
    type: choice
    level: 2
    gold: {fn: choice, column: answer}
    criteria_from: options
    wordings:
      - Which option best answers `question`?
