# TabFact: a Wikipedia table and a statement it supports or refutes. The statements come lemmatized
# in this release ("haroldo be mention as a brazil scorer"); they are used as published.

source: tab_fact
dataset: wenhu/tab_fact
configs: [tab_fact]              # the dataset configs to load
splits: {eval: test, train: train}  # which Hugging Face split the eval and train rows come from (null: none)
license: cc-by-4.0
use: {benchmark: true, train: true}  # what this source may be used for; the builder enforces it
commercial: true                 # may train a model sold commercially: cc-by-4.0
default: false                   # left out of an `all` run unless named
parquet: true                    # read the Parquet conversion, not the loading script
record: tab_fact
train: false                     # benchmark only: multi-step, not a one-step judgment

state:
  table: table

questions:

  claim:
    type: noul
    level: 4
    form: A
    gold: {fn: flag, column: label, equals: 1}
    wordings:
      - '{{ statement }}'
      - According to `table`, {{ statement }}
    opposites:
      - '`table` refutes this: {{ statement }}'
      - 'According to `table`, this is false: {{ statement }}'

  supported:
    type: noul
    level: 4
    form: B
    canonical: false
    gold: {fn: flag, column: label, equals: 1}
    state_extra: {claim: statement}
    wordings:
      - '`table` supports `claim`.'
      - Does `table` support `claim`?
    opposites:
      - '`table` refutes `claim`.'
