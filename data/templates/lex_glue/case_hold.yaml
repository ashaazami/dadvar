# CaseHOLD (LexGLUE): which of five holdings a US court decision cites at the <HOLDING> marker. The
# options are the holdings' own text: the one source whose options are long descriptions.

source: case_hold
dataset: coastalcph/lex_glue
configs: [case_hold]             # the dataset configs to load
splits: {eval: test, train: train}  # which Hugging Face split the eval and train rows come from (null: none)
license: cc-by-4.0
use: {benchmark: true, train: true}  # what this source may be used for; the builder enforces it
commercial: true                 # may train a model sold commercially: cc-by-4.0
default: false                   # left out of an `all` run unless named
record: case_hold
state:
  citing_text: {from: context, role: text}

questions:

  holding:
    type: choice
    level: 4
    grade: 3
    gold: {fn: choice, column: answer}
    criteria_from: options
    wordings:
      - Which holding belongs at <HOLDING> in `citing_text`?
