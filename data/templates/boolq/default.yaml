# BoolQ: a passage and a yes/no question about it (benchmark only).

source: boolq
dataset: google/boolq
configs: [default]               # the dataset configs to load
splits: {eval: validation, train: null}  # which Hugging Face split the eval and train rows come from (null: none)
license: cc-by-sa-3.0
use: {benchmark: true, train: false}  # what this source may be used for; the builder enforces it
commercial: false                # may train a model sold commercially: cc-by-sa-3.0: share-alike
state:
  passage: passage
  question: question

questions:

  answer:
    type: noul
    level: 4
    gold: {fn: noul, column: answer}
    wordings:
      - According to `passage`, should `question` be answered yes?
